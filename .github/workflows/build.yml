name: Build

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # The site is built twice: once as it deploys today (noindex, no sitemap)
    # and once as it will be the day the domain moves (SEARCH_INDEXING=on).
    # content-lint checks that robots.txt, the noindex tags and the sitemap
    # agree in both states, so the published state is proven on every push
    # rather than discovered on launch day.
    strategy:
      matrix:
        indexing: ['off', 'on']
    env:
      SEARCH_INDEXING: ${{ matrix.indexing }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # First, because it reads committed source rather than anything built,
      # and because it is the check that must not be reached too late. A
      # photograph carrying GPS has to fail here, before the commit is merged:
      # git history is permanent, so deleting the file afterwards does not
      # remove what it carried. Vercel runs `npm run build`, which chains this,
      # but a deploy failure comes after the merge and is therefore no use.
      - name: Scan photographs for location metadata
        run: npm run lint:photos

      # Type errors, schema violations, broken image paths and broken content
      # references all surface here rather than on the live site.
      - name: Type-check and validate content
        run: npm run check

      # The unit suites, then the on-demand routes with every provider
      # variable unset: the portal must say it is off, the intake endpoint
      # must answer 503 rather than a false thank-you, the admin API must
      # refuse. Those pages are rendered on demand, so the static build gate
      # below never sees them; this is their gate.
      - name: Test
        run: npm test

      - name: Build
        run: npm run build:fast

      # Reads the built output rather than the source: internal figures,
      # em-dashes in prose, manufacturer names, missing alt text, the same
      # rules again over the writing that ships inside a script, and whether
      # robots.txt, the noindex tags and the sitemap agree with each other.
      - name: Lint content
        run: npm run lint:content

      - name: Check formatting
        run: npm run format:check

  # The other half of the gate: the portal switched on. The Supabase CLI
  # builds a database from nothing out of supabase/migrations/, which fails
  # here if a migration references a table nothing creates, and then a
  # browser walks the portal against it the way a client would: link,
  # request with a photograph, receipt, approval; and runs axe over every
  # public page and the portal screens. The keys the stack prints are the
  # CLI's fixed local demo keys, not secrets.
  portal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - uses: supabase/setup-cli@v1
        with:
          version: 2.117.0

      - name: Build the database from the migrations directory
        run: supabase start -x realtime,imgproxy,mailpit,postgres-meta,studio,edge-runtime,logflare,vector,supavisor

      - name: Hand the stack's address and key to the tests
        run: supabase status -o env | sed 's/"//g' >> "$GITHUB_ENV"

      - run: npx playwright install --with-deps chromium

      - name: Walk the portal, and run axe
        run: npm run test:portal

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: portal-journey-traces
          path: test-results/
          retention-days: 7
